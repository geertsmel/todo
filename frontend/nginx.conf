server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api sont transmis au conteneur "backend" (réseau interne de la stack).
    # Le resolver Docker évite que nginx refuse de démarrer si le backend n'est pas encore prêt.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
